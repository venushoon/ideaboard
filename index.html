<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나만의 아이디어 보드 (Ultimate)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
<script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        MobileDragDrop.polyfill({ holdToDrag: 200, dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride });
        window.addEventListener('touchmove', function() {}, {passive: false});
    });
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginView" style="display: flex;">
    <div class="login-container">
        <h1 class="login-logo">📋 아이디어 보드</h1>
        <p class="login-sub">당신의 교실을 연결하는 가장 완벽한 방법</p>
        
        <div class="login-box">
            <button class="btn-google" onclick="signInWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                선생님 구글 로그인
            </button>
            
            <div class="login-divider"><span>또는 학생/게스트 참가</span></div>
            
            <div class="code-box">
                <input type="text" id="roomCodeInput" class="code-input" placeholder="참여 코드 6자리 입력" maxlength="6" onkeydown="if(event.key==='Enter') enterWithCode()">
                <button class="btn-enter" onclick="enterWithCode()">입장</button>
            </div>
        </div>
    </div>
</div>

<div id="lobbyView">
  <header class="lobby-header">
    <h1 class="lobby-logo"><span>📋</span>나의 보드</h1>
    <div style="display: flex; gap: 12px; align-items: center;">
        <button id="adminBtn" class="btn-new" style="background: var(--navy); display: none;" onclick="openMasterAdmin()">👑 마스터 관리자</button>
        <button class="btn-new" style="background: var(--ink-2);" onclick="openStorageManager()">💾 용량 정리</button>
        <button class="btn-new" style="background: transparent; color: var(--ink); border: 1px solid var(--border); box-shadow: none;" onclick="logout()">로그아웃</button>
    </div>
  </header>
  <div class="lobby-hero">
    <h2 class="lobby-hero-title">환영합니다, <span id="userDisplayName">선생님</span>!</h2>
    <p class="lobby-hero-sub">내 구글 계정에 저장된 프라이빗 보드 목록입니다.</p>
  </div>
  <main class="lobby-main">
    <p class="section-label">내 보드 목록</p>
    <div class="board-grid" id="boardGrid"></div>

    <div id="trashSection" style="margin-top: 64px; display: none;">
      <p class="section-label" style="color: var(--ink-3);">🗑️ 휴지통 (삭제 후 15일 뒤 완전 삭제)</p>
      <div class="board-grid" id="trashGrid"></div>
    </div>
  </main>
  <button class="lobby-fab" onclick="createBoardFromLobby()" title="새 보드 만들기">＋</button>
</div>

<div id="appView">
  <nav class="top-nav">
    <div class="nav-left">
      <div class="board-header-info" onclick="openSidebar()" title="보드 정보 수정하기">
        <h1 class="board-title-text" id="boardTitleText">함께 배움 보드</h1>
        <p class="board-desc-text" id="boardDescText">초대 코드: <span id="displayRoomCode" style="font-weight: 800; color: var(--primary);">로딩중</span></p>
      </div>
    </div>
    <div class="nav-right">
      <button class="nav-back" onclick="exitToLobby()" title="보드 목록으로">← 나가기</button>
      <button class="btn-share" onclick="openModal('shareModal')">📤 공유</button>
      <button class="nav-icon-btn" onclick="openSidebar()" title="설정">⚙️</button>
    </div>
  </nav>

  <div id="board" data-layout="canvas"></div>

  <button class="fab" onclick="openWriteModal(null)" title="아이디어 남기기">＋</button>
</div>

<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
